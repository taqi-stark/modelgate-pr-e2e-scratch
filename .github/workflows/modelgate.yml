name: ModelGate Quality Gate

on:
  pull_request:
    paths:
      - 'demo/**'
      - 'data/**'
      - 'champion/**'
      - 'champion.dvc'
      - 'modelgate.yaml'
      - 'src/**'

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  modelgate:
    name: Run ModelGate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install ModelGate
        run: pip install -e ".[dev]"

      - name: Check champion modification approval
        id: champ_approval
        uses: actions/github-script@v7
        with:
          script: |
            let approved = false;
            try {
              const { data: reviews } = await github.rest.pulls.listReviews({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
              });
              const latestByUser = new Map();
              for (const r of reviews) {
                if (r.user && r.state && r.state !== 'COMMENTED') {
                  latestByUser.set(r.user.login, r.state);
                }
              }
              approved = Array.from(latestByUser.values()).includes('APPROVED');
            } catch (err) {
              core.warning(`Could not query PR reviews: ${err.message}`);
            }
            core.setOutput('approved', approved ? 'true' : 'false');

      - name: Generate demo data
        run: python demo/train.py

      - name: Verify & load champion baseline from base branch
        env:
          ALLOW_CHAMPION_UPDATE: ${{ steps.champ_approval.outputs.approved }}
        run: |
          BASE_REF="${{ github.base_ref }}"
          git fetch origin "${BASE_REF}"
          mapfile -t CHANGED_FILES < <(git diff --name-only "origin/${BASE_REF}...HEAD")
          CHANGED_ARGS=()
          for f in "${CHANGED_FILES[@]}"; do
            if [ -n "$f" ]; then
              CHANGED_ARGS+=(--changed-file "$f")
            fi
          done

          # Extract pinned SHA-256 from base branch champion.dvc (fallback: champion/metadata.json)
          PINNED_SHA=$(git show "origin/${BASE_REF}:champion.dvc" 2>/dev/null | python -c "import sys, yaml; d = yaml.safe_load(sys.stdin) or {}; print((d.get('outs') or [{}])[0].get('sha256', ''))" || true)
          if [ -z "$PINNED_SHA" ]; then
            PINNED_SHA=$(git show "origin/${BASE_REF}:champion/metadata.json" 2>/dev/null | python -c "import sys, json; print(json.load(sys.stdin).get('model_sha256', ''))" || true)
          fi

          # Always load champion/ and champion.dvc from the trusted base branch
          git checkout "origin/${BASE_REF}" -- champion champion.dvc

          # Verify SHA-256 against pinned base-branch value and reject unapproved champion/ changes
          modelgate baseline verify \
            --dir champion \
            --dvc champion.dvc \
            --pinned-sha256 "$PINNED_SHA" \
            "${CHANGED_ARGS[@]}"

          modelgate baseline import \
            --config modelgate.yaml \
            --dir champion \
            --pinned-sha256 "$PINNED_SHA"

      - name: Run ModelGate
        id: gate
        run: |
          modelgate run \
            --config modelgate.yaml \
            --branch "${{ github.head_ref }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --output modelgate_output
        continue-on-error: true

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modelgate-report
          path: modelgate_output/report.html

      - name: Post PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const commentPath = 'modelgate_output/pr_comment.md';
            if (!fs.existsSync(commentPath)) {
              console.log('No PR comment file found');
              return;
            }
            const body = fs.readFileSync(commentPath, 'utf8');
            const marker = '<!-- modelgate-verdict -->';

            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });

              const existing = comments.find(c => c.body.includes(marker));

              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body: `${marker}\n${body}`,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: `${marker}\n${body}`,
                });
              }
            } catch (err) {
              core.warning(`Unable to post PR comment (expected on fork PRs with read-only token): ${err.message}`);
            }

      - name: Set commit status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const verdictPath = 'modelgate_output/verdict.json';
            if (!fs.existsSync(verdictPath)) {
              console.log('No verdict file found');
              return;
            }
            const verdict = JSON.parse(fs.readFileSync(verdictPath, 'utf8'));
            const stateMap = { pass: 'success', warn: 'success', fail: 'failure' };

            try {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.payload.pull_request ? context.payload.pull_request.head.sha : context.sha,
                state: stateMap[verdict.status] || 'error',
                description: verdict.summary.substring(0, 140),
                context: 'modelgate',
              });
            } catch (err) {
              core.warning(`Unable to set commit status (expected on fork PRs with read-only token): ${err.message}`);
            }

      - name: Fail if verdict is FAIL
        if: steps.gate.outcome == 'failure'
        run: exit 1
