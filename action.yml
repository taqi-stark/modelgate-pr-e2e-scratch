name: 'ModelGate Quality Gate'
description: 'Production CI/CD quality gate for ML models: data contracts, drift, leakage, label shift, slice regression, behavioral tests, latency/size budgets, and fairness.'
author: 'ModelGate Authors'

inputs:
  config:
    description: 'Path to modelgate.yaml configuration file'
    required: false
    default: 'modelgate.yaml'
  python-version:
    description: 'Python version to use'
    required: false
    default: '3.11'
  output-dir:
    description: 'Directory to store generated reports and PR comments'
    required: false
    default: 'modelgate_output'
  baseline-dir:
    description: 'Directory containing persisted champion baseline (model.pkl, metadata.json, metrics.json)'
    required: false
    default: 'champion'
  setup-data:
    description: 'Command to prepare data on a clean checkout when data/train.csv is absent (e.g. dvc pull or python demo/train.py)'
    required: false
    default: 'python demo/train.py'
  fail-on-verdict:
    description: 'Fail the GitHub Actions workflow step if the verdict is FAIL'
    required: false
    default: 'true'

outputs:
  verdict:
    description: 'Overall quality gate verdict: pass, warn, or fail'
    value: ${{ steps.gate.outputs.verdict }}
  summary:
    description: 'Summary of check outcomes and key reasons'
    value: ${{ steps.gate.outputs.summary }}
  report-html:
    description: 'Path to the generated standalone HTML report'
    value: '${{ inputs.output-dir }}/report.html'
  pr-comment:
    description: 'Path to the generated Markdown PR comment'
    value: '${{ inputs.output-dir }}/pr_comment.md'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install ModelGate
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Prepare Data & Import Champion Baseline
      shell: bash
      run: |
        if [ ! -f "data/train.csv" ]; then
          if [ -s ".dvc/config" ] && command -v dvc >/dev/null 2>&1; then
            dvc pull
          elif [ -n "${{ inputs.setup-data }}" ]; then
            ${{ inputs.setup-data }}
          fi
        fi
        if [ -f "${{ inputs.baseline-dir }}/model.pkl" ]; then
          modelgate baseline import --config "${{ inputs.config }}" --dir "${{ inputs.baseline-dir }}"
        fi

    - name: Run Quality Gate Checks
      id: gate
      shell: bash
      run: |
        mkdir -p "${{ inputs.output-dir }}"
        PR_NUM="${{ github.event.pull_request.number }}"
        BRANCH="${{ github.head_ref || github.ref_name }}"

        set +e
        if [ -n "$PR_NUM" ]; then
          modelgate run --config "${{ inputs.config }}" --output "${{ inputs.output-dir }}" --branch "$BRANCH" --pr "$PR_NUM"
        else
          modelgate run --config "${{ inputs.config }}" --output "${{ inputs.output-dir }}" --branch "$BRANCH"
        fi
        GATE_EXIT=$?
        set -e

        if [ -f "${{ inputs.output-dir }}/verdict.json" ]; then
          STATUS=$(python -c "import json; v = json.load(open('${{ inputs.output-dir }}/verdict.json')); print(v.get('status', 'fail'))")
          SUMMARY=$(python -c "import json; v = json.load(open('${{ inputs.output-dir }}/verdict.json')); print(v.get('summary', ''))")
        else
          STATUS="fail"
          SUMMARY="Quality gate execution failed (exit ${GATE_EXIT}) and did not produce verdict.json"
        fi

        if [ -n "${GITHUB_OUTPUT:-}" ]; then
          echo "verdict=$STATUS" >> "$GITHUB_OUTPUT"
          echo "summary=$SUMMARY" >> "$GITHUB_OUTPUT"
        fi

        if [ "${{ inputs.fail-on-verdict }}" = "true" ] && [ "$STATUS" = "fail" ]; then
          echo "::error::ModelGate quality gate failed: $SUMMARY"
          exit 1
        fi
        exit 0
